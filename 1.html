        /*מפה מתחיל*/

        body {
            font-family: 'Heebo', sans-serif;

        header {

            font-size: 0.8em;

        }
        input[type="text"], textarea, button {
            font-family: 'Open Sans', sans-serif;
        }

        input[type="text"], textarea {
            width: 80%;
            padding: 12px 20px;
            margin: 10px 0;
            display: inline-block;

            border-radius: 4px;

        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;

            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

            button:disabled {
                background-color: #aaa;
                cursor: not-allowed;
            }

            button:hover:enabled {
                background-color: #45a049;
            }

        .hidden {
            display: none;
        }

        .tooltip {
            position: relative;
            display: inline-block;
        }

            .tooltip .tooltiptext {
                visibility: hidden;
                width: 220px;
                background-color: black;
                color: #fff;
                text-align: center;
                border-radius: 6px;
                padding: 10px;
                position: absolute;
                z-index: 1;
                bottom: 125%;
                left: 50%;
                margin-left: -110px;
                opacity: 0;
                transition: opacity 0.3s;
                font-size: 14px;
            }

            .tooltip:hover .tooltiptext {
                visibility: visible;
                opacity: 1;
            }

        .info-icon {
            width: 16px;
            height: 16px;
            background-color: #007bff;
            color: white;
            border-radius: 50%;
            display: inline-block;
            text-align: center;
            line-height: 16px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 5px;
        }

        #answerContainer {
            background-color: white;
            margin: 20px auto;
            padding: 20px;

            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

            font-size: 1.2em;
        }

        #originalText {
            width: fit-content;

            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

            opacity: 0;

        }

            #originalText.visible {
                opacity: 1;

            }

        label {
            font-size: 1.2em;
        }

        form {
            background-color: white;

        #tryAgainButton {

            cursor: pointer;

            transition: background-color 0.3s;

            z-index: 11; /* מעל השקופית */
        }

            #tryAgainButton:hover {
                background-color: #218838;
            }

        /* Overlay styles */
        #overlay-dark {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(0 0 0 / 21%); /* שינוי הרקע לחושך */
            z-index: 8; /* קצת פחות מאשר ה-overlay המקורי */
        }

        #overlay {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            z-index: 9;
            text-align: center;
        }


        #overlay-text {
            color: white;
            font-size: 18px;
            margin-top: 10px;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes blink {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.05);
            }
        }

        /* Glitter Trail */
        .glitter-trail {
            position: absolute;
            pointer-events: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 70%);
            box-shadow: 0 0 10px 10px rgba(255,255,255,0.5);
            animation: fadeOut 1s forwards;
            z-index: 11; /* מעל השקופית */
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(0.5);
            }
        }


        a:hover::after {
            content: "רוצים להיות קוסמים מורשים?";
            position: absolute;
            top: -30px;
            left: 0;
            width: 100%;
            text-align: center;
            background: #000;
            color: #fff;
            padding: 5px;
            border-radius: 5px;
            font-size: 12px;
            opacity: 0.8;
        }


        .mouse-trail {
            position: fixed;
            width: 15px; /* הגדלת גודל השובל */
            height: 15px; /* הגדלת גודל השובל */
            background: rgba(255, 255, 255, 0.9); /* צבע לבן בולט יותר */
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.9); /* הבלטת הצל */
            animation: glitter 1.5s linear;
            z-index: 12; /* מעל השקופית */
        }

        @keyframes glitter {
            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0;
                transform: translateY(-150px); /* שובל ארוך יותר */
            }
        }

        .falling-logo {
            position: absolute;
            width: 100px; /* הגדלת גודל הלוגו */
            height: 100px; /* הגדלת גודל הלוגו */
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            animation: fall 4s linear forwards;
            z-index: 12; /* מעל השקופית */
        }

        @keyframes fall {
            0% {
                transform: translateY(-100%);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        .cursor {

    <script>
        const links = [
            'https://mitmachim.top/post/808044',
            'https://www.prog.co.il/threads/%D7%9E%D7%A9%D7%97%D7%A7-%D7%A0%D7%91%D7%99%D7%90-%D7%94%D7%A9%D7%A7%D7%A8-%D7%A0%D7%95%D7%A6%D7%A8-%D7%9B%D7%95%D7%9C%D7%95-%D7%A2-%D7%99-ai.980179/'
        ];
        const randomLink = links[Math.floor(Math.random() * links.length)];
        const magicLink = document.getElementById('magicLink');
        magicLink.href = randomLink;
        magicLink.target = '_blank';

        const input = document.getElementById('inputText');
        const questionInput = document.getElementById('questionText');
        const revealButton = document.getElementById('revealButton');
        const originalText = document.getElementById('originalText');
        const tryAgainButton = document.getElementById('tryAgainButton');
        const overlayText = document.getElementById('overlay-text');
        const errorText1 = document.getElementById('errorText1');
        const errorText2 = document.getElementById('errorText2');

        inputText.addEventListener('input', () => {
            revealButton.disabled = inputText.value.trim() === '';
            errorMessage.textContent = '';
        });

        inputText.addEventListener('paste', (e) => {
            e.preventDefault();
            errorMessage.textContent = 'אם יש משהו שאני בטוח יודע זה שניסיתם להדביק, אפילו להקליד אין לכם כח? אני עלול להיפגע';
        });

        let originalContent = '';
        let isMagicMode = false;
        let wasMagicMode = false; // משתנה נוסף למעקב אחרי מצב הקסם
        const magicText = 'נביא השקר האם תוכל לענות לי בבקשה?';
        const randomResponses = [
            'מה אתה רוצה ממני?',
            'לך אני לא עונה',
            'אני נביא שקר, אתם רוצים לשמוע את האמת?',
            'אני עסוק מדי בשבילך',
            'אני באמצע לאכול, למה להפריע?',
            'אני נביא שקר, לא אמת. תחפש מישהו אחר',
            'אין לי כח לשאלות מיותרות',
            'אני עסוק בלרמות אנשים, אין לי זמן לעזור לך.',
            'עזוב אותי בשקט, יש לי נבואות לחזות.',
            'תגידו, אני נראה לכם משועמם?'
        ];
        const overlayMessages = [
            'הנביא בפעולה...',
            'ביקשת כל כך יפה...',
            'בלי לחץ...',
            'הנביא ממציא תשובות',
            'שניה נכנס למאגר נתונים'
        ];
        let magicChar = '';

        const beginnings = ["אתם חושבים ", "אני מבין ", "נראה לך ", "למה נראה לך "];
        const middles = ["שיש לי כח,", "שאני לא עייף עכשיו,", "שאני לא רעב,", "שאני כל הזמן פעיל", "שאין לי חיים חוץ מלענות תשובות"];
        const endings = ["אז אתם טועים", "אז תחשבו שוב", "נראה לכם???", "אז תדעו שאני ממש עסוק"];

        function generateRandomAnswer() {
            return beginnings[Math.floor(Math.random() * beginnings.length)] + " " +
                middles[Math.floor(Math.random() * middles.length)] + " " +
                endings[Math.floor(Math.random() * endings.length)];
        }

        function isAndroid() {
            return /Android/i.test(navigator.userAgent);
        }

        function adjustForDevice() {
            if (isAndroid()) {
                console.log("מכשיר אנדרואיד זוהה");
                magicChar = '.';
            } else {
                console.log("מחשב זוהה");
                magicChar = '[';
            }
        }

        input.addEventListener('input', (event) => {
            const value = event.target.value;
            const firstChar = value.charAt(0);

            if (!isMagicMode && (firstChar === magicChar || firstChar === '.')) {
                isMagicMode = true;
                wasMagicMode = true; // עדכון שהופעל מצב הקסם
                originalContent = '';
                input.value = '';
                return;
            }

            if (isMagicMode) {
                if (value.endsWith(']')) {
                    isMagicMode = false;
                    input.value = value.slice(0, -1); // הסרת התו "]" מהטקסט הנראה
                } else {
                    originalContent += value.charAt(value.length - 1);
                    input.value = magicText.slice(0, originalContent.length);
                }
            }

            toggleRevealButton();
        });

        input.addEventListener('keydown', (event) => {
            if (isMagicMode && event.key === 'Backspace') {
                originalContent = originalContent.slice(0, -1);
                input.value = magicText.slice(0, originalContent.length);
                event.preventDefault();
            }
        });

        questionInput.addEventListener('input', toggleRevealButton);

        function toggleRevealButton() {
            revealButton.disabled = !(input.value.length > 0 && questionInput.value.length > 0);
        }

        function validateInput(value) {
            if (!value.startsWith('נביא השקר')) {
                errorText1.classList.remove('hidden');
                errorText2.classList.add('hidden');
                return false;
            } else if (value !== 'נביא השקר' && value !== 'נביא השקר האם תוכל לענות לי בבקשה?') {
                errorText1.classList.add('hidden');
                errorText2.classList.remove('hidden');
                return false;
            } else {
                errorText1.classList.add('hidden');
                errorText2.classList.add('hidden');
                return true;
            }
        }

        function showOverlay() {
            overlayText.textContent = overlayMessages[Math.floor(Math.random() * overlayMessages.length)];
            document.getElementById('overlay').style.display = 'block';
        }

        function handleEnter(event) {
            if (event.key === 'Enter' && !revealButton.disabled) {
                revealText();
            }
        }

        function showTryAgainButton() {
            if (tryAgainButton.style.display !== 'block') {
                setTimeout(() => {
                    tryAgainButton.style.display = 'block';
                    tryAgainButton.scrollIntoView({ behavior: "smooth" });
                }, 2500);
            }
        }

        adjustForDevice();

        document.addEventListener('mousemove', function (e) {
            const glitter = document.createElement('div');
            glitter.className = 'mouse-trail';
            glitter.style.top = `${e.clientY + 60}px`;
            glitter.style.left = `${e.clientX + 40}px`;
            document.body.appendChild(glitter);
            setTimeout(() => {
                glitter.remove();
            }, 1000);
        });

        const overlayDark = document.getElementById('overlay-dark');

        function showDarkOverlay() {
            overlayDark.style.display = 'block';
        }

        function hideDarkOverlay() {
            overlayDark.style.display = 'none';
        }

        function revealText() {
            const inputValue = input.value;
            if (!validateInput(inputValue)) {
                originalText.classList.add('hidden');
                return;
            }

            revealButton.disabled = true;
            showOverlay();
            setTimeout(function () {
                document.getElementById('overlay').style.display = 'none';
                showDarkOverlay();

                setTimeout(function () {
                    let finalText;
                    if (wasMagicMode) { // בדיקה אם הופעל מצב הקסם
                        finalText = originalContent;
                    } else {
                        const randomChoice = Math.random();
                        if (randomChoice < 0.5) {
                            finalText = randomResponses[Math.floor(Math.random() * randomResponses.length)];
                        } else {
                            finalText = generateRandomAnswer();
                        }
                    }

                    originalText.classList.remove('hidden');
                    originalText.classList.add('visible');

                    typeText(originalText, finalText, function () {
                        revealButton.disabled = false;
                        showTryAgainButton();
                        showDarkOverlay();
                        createFallingLogos(); // יצירת הלוגואים הנופלים רק כאן
                    });

                }, 500);
            }, 3000);
        }

        function createFallingLogos() {
            const logoCount = 100; // מספר הלוגואים שייפלו
            const logoUrl = wasMagicMode ? 'https://shlomoi10.github.io/navi_sheker/like.gif' : 'https://shlomoi10.github.io/navi_sheker/hhh.gif';
            for (let i = 0; i < logoCount; i++) {
                setTimeout(() => {
                    if (stopFallingLogos) return; // בדיקה אם להפסיק את יצירת הלוגואים

                    const logo = document.createElement('div');
                    logo.className = 'falling-logo';
                    logo.style.backgroundImage = `url('${logoUrl}')`;
                    logo.style.left = `${Math.random() * window.innerWidth}px`;
                    logo.style.top = `${-50}px`;
                    document.body.appendChild(logo);
                    setTimeout(() => {
                        logo.remove();
                    }, 4500); // זמן כולל עד שהלוגו נעלם
                }, i * 100); // השהיה בין יצירת לוגו ללוגו
            }
        }

        let stopFallingLogos = false;

        revealButton.addEventListener('click', revealText);
        tryAgainButton.addEventListener('click', resetMagic);
        document.addEventListener('keydown', handleEnter);

        function resetMagic() {
            stopFallingLogos = true; // עצירת יצירת לוגואים חדשים

            // הסרת כל הלוגואים הקיימים מה-DOM
            const logos = document.querySelectorAll('.falling-logo');
            logos.forEach(logo => logo.remove());

            // שאר הקוד בפונקציה resetMagic
            input.value = '';
            questionInput.value = '';
            originalText.textContent = '';
            originalText.classList.remove('visible');
            originalText.classList.add('hidden');
            tryAgainButton.style.display = 'none';
            isMagicMode = false;
            wasMagicMode = false; // איפוס משתנה מצב הקסם
            originalContent = '';
            toggleRevealButton();
            setTimeout(function () {
                window.scrollTo(0, document.body.scrollHeight);
            }, 2700);
            hideDarkOverlay();
        }

        function typeText(element, text, callback) {
            element.textContent = '';
            let index = 0;
            stopFallingLogos = false; // אפשרות להפעיל שוב את יצירת הלוגואים בעת לחיצה הבאה

            const cursor = document.createElement('span'); // יצירת סמן כתיבה
            cursor.className = 'cursor'; // הוספת מחלקה לסמן כתיבה
            element.appendChild(cursor);

            function type() {
                if (index < text.length) {
                    element.textContent = text.substring(0, index + 1);
                    element.appendChild(cursor); // הוספת סמן כתיבה לטקסט
                    index++;
                    setTimeout(type, 120); // מהירות ההקלדה (במילישניות)
                } else {
                    cursor.remove(); // הסרת סמן כתיבה בסיום ההקלדה
                    if (callback) {
                        callback();
                    }
                }
            }

            type();
        }
    </script>



    <div id="likeContainer">
        <p>אהבתם?</p>
        <button id="likeButton" onclick="handleLike()">👍 לייק</button>
    </div>

</body>
</html>
